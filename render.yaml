services:
  - type: web
    name: pixcellens
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: PIXCELLENS_PUBLIC_URL
        value: https://picxellens.onrender.com
      - key: PUBLIC_URL
        value: https://picxellens.onrender.com